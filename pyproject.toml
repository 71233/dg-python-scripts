[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dg-python-scripts"
dynamic = ["version"]
description = "DG Python tools for Autodesk Flame"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/71233/dg-python-scripts"

[tool.setuptools.dynamic]
version = {attr = "dg_python_scripts.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/dg-python-scripts/bootstrap" = ["bootstrap/dgpy_bootstrap.py"]
